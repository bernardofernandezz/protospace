    <style>
      /* tela de carregamento: aparece antes do JS e sai quando o hero 3D está pronto (src/lib/boot.ts) */
      html,
      body {

      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;

      #boot.boot-out {

      }
      #boot svg {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 0 14px rgba(62, 240, 208, 0.45));
      }
      #boot path {
        stroke-dasharray: 80;

      #boot .name {

          sans-serif;
        letter-spacing: -0.01em;
        color: #fff;
      }
      #boot .name b {
        color: #3ef0d0;
        font-weight: 600;
      }
      #boot .bar {
        position: relative;
        width: 168px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      #boot .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #3ef0d0, #7dff9b, #ff4fa3);
        animation: boot-bar 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
      }
      @keyframes boot-draw {
        from {
          stroke-dashoffset: 80;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-bar {
        from {
          translate: -100% 0;
        }
        to {
          translate: 250% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot path,
        #boot .bar::after {
          animation: none;
          stroke-dasharray: none;
        }
      }
